name: Compile Forerunner 265

# Official device profiles require interactive Garmin SDK Manager provisioning.
# Only the repository owner may manually build trusted main on the dedicated runner.
# Never add pull_request, pull_request_target, or workflow_run to this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prismelier-fr265-compile
  cancel-in-progress: false

jobs:
  compile:
    if: github.repository == 'bensonlee5/prismelier' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, linux, x64, prismelier-fr265]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check official SDK, FR265 profile and local key
        run: python3 tools/ci_build.py preflight
      - name: Run source and asset checks
        run: python3 -m unittest discover -s tests -v
      - name: Compile and sign the actual FR265 program
        run: python3 tools/ci_build.py compile
      - name: Upload the compiled program and build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Prismelier-fr265-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-artifact/Prismelier.prg
            build/ci-artifact/SHA256SUMS
            build/ci-artifact/build-info.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
